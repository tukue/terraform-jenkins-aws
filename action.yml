name: Deploy application to the platform
description: Build and scan a Dockerfile-based application, publish it to ECR, and deploy it to EKS using the platform Helm chart.
inputs:
  config-path:
    description: Path to platform/app.env in the calling repository.
    required: false
    default: platform/app.env
  image-tag:
    description: Unique immutable suffix for the ECR image tag.
    required: true
  aws-region:
    description: AWS region containing EKS and ECR.
    required: true
  eks-cluster-name:
    description: Terraform output eks_cluster_name.
    required: true
  ecr-repository:
    description: Terraform output ecr_repository_url.
    required: true
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@v4
    - name: Prepare image and authenticate to ECR
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        AWS_REGION: ${{ inputs.aws-region }}
        EKS_CLUSTER_NAME: ${{ inputs.eks-cluster-name }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        PLATFORM_CHART: ${{ github.action_path }}/charts/application
      run: |
        set -Eeuo pipefail
        test -f "$CONFIG_PATH"
        declare -A config
        while IFS= read -r raw_line || [[ -n "$raw_line" ]]; do
          line="${raw_line#"${raw_line%%[![:space:]]*}"}"
          line="${line%"${line##*[![:space:]]}"}"
          [[ -z "$line" || "$line" == \#* ]] && continue
          [[ "$line" =~ ^([A-Z_]+)=([^[:cntrl:]]*)$ ]] || { echo "Invalid config line: $line" >&2; exit 1; }
          key="${BASH_REMATCH[1]}"
          value="${BASH_REMATCH[2]}"
          case "$key" in
            APP_NAME|SOURCE_PATH|DOCKERFILE|CONTAINER_PORT|HEALTH_PATH|SERVICE_TYPE|REPLICA_COUNT|TEST_COMMAND) ;;
            *) echo "Unsupported config key: $key" >&2; exit 1 ;;
          esac
          [[ -z "${config[$key]+x}" ]] || { echo "Duplicate config key: $key" >&2; exit 1; }
          config[$key]="$value"
        done < "$CONFIG_PATH"
        for key in APP_NAME SOURCE_PATH DOCKERFILE CONTAINER_PORT HEALTH_PATH SERVICE_TYPE; do
          [[ -n "${config[$key]:-}" ]] || { echo "Missing required config key: $key" >&2; exit 1; }
        done
        APP_NAME="${config[APP_NAME]}"
        SOURCE_PATH="${config[SOURCE_PATH]}"
        DOCKERFILE="${config[DOCKERFILE]}"
        CONTAINER_PORT="${config[CONTAINER_PORT]}"
        HEALTH_PATH="${config[HEALTH_PATH]}"
        SERVICE_TYPE="${config[SERVICE_TYPE]}"
        REPLICA_COUNT="${config[REPLICA_COUNT]:-}"
        [[ "$APP_NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ && "$APP_NAME" != *--* ]]
        [[ "$CONTAINER_PORT" =~ ^[0-9]+$ ]]
        [[ "$HEALTH_PATH" == /* ]]
        [[ "$SERVICE_TYPE" == "ClusterIP" || "$SERVICE_TYPE" == "LoadBalancer" ]]
        [[ -z "$REPLICA_COUNT" || "$REPLICA_COUNT" =~ ^[1-9][0-9]*$ ]]
        workspace=$(pwd -P)
        config_directory=$(dirname "$(realpath "$CONFIG_PATH")")
        source_directory=$(realpath -m "$config_directory/$SOURCE_PATH")
        dockerfile=$(realpath -m "$source_directory/$DOCKERFILE")
        [[ "$source_directory" == "$workspace" || "$source_directory" == "$workspace/"* ]]
        [[ "$dockerfile" == "$source_directory/"* ]]
        test -f "$dockerfile"
        registry="${ECR_REPOSITORY%%/*}"
        image_tag="${APP_NAME}-${IMAGE_TAG}"
        image="${ECR_REPOSITORY}:${image_tag}"
        ecr_password=$(aws ecr get-login-password --region "$AWS_REGION")
        [[ -n "$ecr_password" ]] || { echo "ECR returned an empty login password" >&2; exit 1; }
        printf '%s' "$ecr_password" | docker login --username AWS --password-stdin "$registry"
        {
          echo "PLATFORM_APP_NAME=$APP_NAME"
          echo "PLATFORM_SOURCE_DIRECTORY=$source_directory"
          echo "PLATFORM_DOCKERFILE=$dockerfile"
          echo "PLATFORM_IMAGE=$image"
          echo "PLATFORM_IMAGE_TAG=$image_tag"
          echo "PLATFORM_AWS_REGION=$AWS_REGION"
          echo "PLATFORM_EKS_CLUSTER_NAME=$EKS_CLUSTER_NAME"
          echo "PLATFORM_ECR_REPOSITORY=$ECR_REPOSITORY"
          echo "PLATFORM_CHART=$PLATFORM_CHART"
          echo "PLATFORM_CONTAINER_PORT=$CONTAINER_PORT"
          echo "PLATFORM_HEALTH_PATH=$HEALTH_PATH"
          echo "PLATFORM_SERVICE_TYPE=$SERVICE_TYPE"
          echo "PLATFORM_REPLICA_COUNT=$REPLICA_COUNT"
        } >> "$GITHUB_ENV"

    - name: Build container image
      shell: bash
      run: docker build --file "$PLATFORM_DOCKERFILE" --tag "$PLATFORM_IMAGE" "$PLATFORM_SOURCE_DIRECTORY"

    - name: Scan image for High and Critical vulnerabilities
      uses: aquasecurity/trivy-action@a9c7b0f06e461e9d4b4d1711f154ee024b8d7ab8
      with:
        image-ref: ${{ env.PLATFORM_IMAGE }}
        format: table
        exit-code: '1'
        severity: HIGH,CRITICAL
        vuln-type: os,library

    - name: Publish image and deploy
      shell: bash
      run: |
        set -Eeuo pipefail
        docker push "$PLATFORM_IMAGE"
        aws eks update-kubeconfig --name "$PLATFORM_EKS_CLUSTER_NAME" --region "$PLATFORM_AWS_REGION"
        helm_args=(upgrade --install "$PLATFORM_APP_NAME" "$PLATFORM_CHART" --namespace "$PLATFORM_APP_NAME" --create-namespace --wait --timeout 10m --set "image.repository=$PLATFORM_ECR_REPOSITORY" --set "image.tag=$PLATFORM_IMAGE_TAG" --set "containerPort=$PLATFORM_CONTAINER_PORT" --set "health.path=$PLATFORM_HEALTH_PATH" --set "service.type=$PLATFORM_SERVICE_TYPE")
        if [[ -n "${PLATFORM_REPLICA_COUNT:-}" ]]; then helm_args+=(--set "replicaCount=$PLATFORM_REPLICA_COUNT"); fi
        helm "${helm_args[@]}"
        kubectl rollout status "deployment/$PLATFORM_APP_NAME" --namespace "$PLATFORM_APP_NAME" --timeout=5m
        kubectl get service "$PLATFORM_APP_NAME" --namespace "$PLATFORM_APP_NAME" --output wide
