name: Deploy application to the platform
description: Build a Dockerfile-based application, publish it to ECR, and deploy it to EKS using the platform Helm chart.
inputs:
  config-path:
    description: Path to platform/app.env in the calling repository.
    required: false
    default: platform/app.env
  image-tag:
    description: Unique immutable suffix for the ECR image tag.
    required: true
  aws-region:
    description: AWS region containing EKS and ECR.
    required: true
  eks-cluster-name:
    description: Terraform output eks_cluster_name.
    required: true
  ecr-repository:
    description: Terraform output ecr_repository_url.
    required: true
runs:
  using: composite
  steps:
    - uses: azure/setup-helm@v4
    - name: Build, publish, and deploy
      shell: bash
      env:
        CONFIG_PATH: ${{ inputs.config-path }}
        IMAGE_TAG: ${{ inputs.image-tag }}
        AWS_REGION: ${{ inputs.aws-region }}
        EKS_CLUSTER_NAME: ${{ inputs.eks-cluster-name }}
        ECR_REPOSITORY: ${{ inputs.ecr-repository }}
        PLATFORM_CHART: ${{ github.action_path }}/charts/application
      run: |
        set -Eeuo pipefail
        test -f "$CONFIG_PATH"
        set -a
        source "$CONFIG_PATH"
        set +a
        : "${APP_NAME:?APP_NAME is required}"
        : "${SOURCE_PATH:?SOURCE_PATH is required}"
        : "${DOCKERFILE:?DOCKERFILE is required}"
        : "${CONTAINER_PORT:?CONTAINER_PORT is required}"
        : "${HEALTH_PATH:?HEALTH_PATH is required}"
        : "${SERVICE_TYPE:?SERVICE_TYPE is required}"
        [[ "$APP_NAME" =~ ^[a-z0-9]([-a-z0-9]*[a-z0-9])?$ ]]
        [[ "$CONTAINER_PORT" =~ ^[0-9]+$ ]]
        [[ "$HEALTH_PATH" == /* ]]
        [[ "$SERVICE_TYPE" == "ClusterIP" || "$SERVICE_TYPE" == "LoadBalancer" ]]
        config_directory=$(dirname "$CONFIG_PATH")
        source_directory="$config_directory/$SOURCE_PATH"
        dockerfile="$source_directory/$DOCKERFILE"
        test -f "$dockerfile"
        registry="${ECR_REPOSITORY%%/*}"
        image_tag="${APP_NAME}-${IMAGE_TAG}"
        image="${ECR_REPOSITORY}:${image_tag}"
        aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "$registry"
        docker build --file "$dockerfile" --tag "$image" "$source_directory"
        docker push "$image"
        aws eks update-kubeconfig --name "$EKS_CLUSTER_NAME" --region "$AWS_REGION"
        helm_args=(upgrade --install "$APP_NAME" "$PLATFORM_CHART" --namespace "$APP_NAME" --create-namespace --wait --timeout 10m --set "image.repository=$ECR_REPOSITORY" --set "image.tag=$image_tag" --set "containerPort=$CONTAINER_PORT" --set "health.path=$HEALTH_PATH" --set "service.type=$SERVICE_TYPE")
        if [[ -n "${REPLICA_COUNT:-}" ]]; then helm_args+=(--set "replicaCount=$REPLICA_COUNT"); fi
        helm "${helm_args[@]}"
        kubectl rollout status "deployment/$APP_NAME" --namespace "$APP_NAME" --timeout=5m
        kubectl get service "$APP_NAME" --namespace "$APP_NAME" --output wide
