replicaCount: 2

image:
  repository: ""
  tag: ""
  pullPolicy: IfNotPresent

containerPort: 8080

service:
  type: LoadBalancer
  port: 80

health:
  path: /healthz
  initialDelaySeconds: 5

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 250m
    memory: 256Mi

env: []

ingress:
  enabled: false
